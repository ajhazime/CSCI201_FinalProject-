<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USC FIT - Account Recovery</title>
    <style>
        :root {
            --usc-cardinal: #992233;
            --usc-gold: #FFCC00;
            --bg-dark: #121212;
            --card-white: #ffffff;
            --input-bg: #f8f8f8;
            --text-main: #333;
            --text-muted: #666;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image: repeating-linear-gradient(45deg, #1a1a1a 0px, #1a1a1a 2px, transparent 2px, transparent 10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 0;
            color: white;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: var(--usc-gold); font-size: 28px; letter-spacing: 2px; margin: 0; text-transform: uppercase; }
        .header p { font-size: 10px; color: #888; letter-spacing: 3px; text-transform: uppercase; margin-top: 5px; }

        .card {
            background: var(--card-white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            color: var(--text-main);
        }

        h2 { margin: 0 0 6px 0; font-size: 22px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: color 0.2s;
        }

        .tab.active {
            color: var(--usc-cardinal);
            border-bottom-color: var(--usc-cardinal);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: var(--input-bg);
            box-sizing: border-box;
            font-size: 14px;
        }

        button[type="submit"] {
            width: 100%;
            background-color: var(--usc-cardinal);
            color: white;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s;
        }

        button[type="submit"]:hover { opacity: 0.9; }
        button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

        .msg {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .msg.success { background: #e8f5ea; color: #2f6b40; display: block; }
        .msg.error { background: #fde8e8; color: #992233; display: block; }

        .result-box {
            margin-top: 14px;
            padding: 14px;
            background: #f5f2ef;
            border-radius: 8px;
            font-size: 15px;
            display: none;
        }

        .result-box strong { display: block; font-size: 20px; margin-top: 4px; }

        .footer-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--usc-cardinal);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>USC FIT</h1>
        <p>Campus Fitness Platform</p>
    </div>

    <div class="card">
        <h2>Account Recovery</h2>
        <p class="subtitle">Use your USC email to recover your account</p>

        <div class="tabs">
            <div class="tab active" data-tab="username">Find Username</div>
            <div class="tab" data-tab="forgot">Forgot Password</div>
        </div>

        <!-- Find Username -->
        <div class="tab-panel active" id="panel-username">
            <form id="usernameForm">
                <div class="form-group">
                    <label>USC Email Address</label>
                    <input type="email" name="email" placeholder="username@usc.edu" required>
                </div>
                <button type="submit" id="usernamBtn">Find My Username</button>
            </form>
            <div class="result-box" id="usernameResult">
                Your username is: <strong id="foundUsername"></strong>
            </div>
            <div class="msg" id="usernameMsg"></div>
        </div>

        <!-- Forgot Password (security question flow) -->
        <div class="tab-panel" id="panel-forgot">

            <!-- Step 1: enter email -->
            <div id="forgot-step1">
                <form id="forgotEmailForm">
                    <div class="form-group">
                        <label>USC Email Address</label>
                        <input type="email" name="email" placeholder="username@usc.edu" required>
                    </div>
                    <button type="submit" id="forgotEmailBtn">Find My Account</button>
                </form>
                <div class="msg" id="forgotStep1Msg"></div>
            </div>

            <!-- Step 2: answer security question -->
            <div id="forgot-step2" style="display:none;">
                <p style="font-size:13px;color:#666;margin:0 0 16px;">Answer your security question to continue.</p>
                <div class="form-group">
                    <label>Security Question</label>
                    <p id="forgotQuestion" style="margin:6px 0 0;font-weight:bold;font-size:14px;color:#333;"></p>
                </div>
                <form id="forgotAnswerForm">
                    <div class="form-group" style="margin-top:14px;">
                        <label>Your Answer</label>
                        <input type="text" name="answer" placeholder="Answer (case-insensitive)" required>
                    </div>
                    <button type="submit" id="forgotAnswerBtn">Verify Answer</button>
                </form>
                <div class="msg" id="forgotStep2Msg"></div>
                <button type="button" onclick="forgotReset()" style="margin-top:10px;background:none;border:none;color:#999;font-size:12px;cursor:pointer;">← Start over</button>
            </div>

            <!-- Step 3: set new password -->
            <div id="forgot-step3" style="display:none;">
                <p style="font-size:13px;color:#2f6b40;margin:0 0 16px;">Identity verified. Set your new password.</p>
                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label>New Password (min. 12 characters)</label>
                        <input type="password" name="newPassword" placeholder="New password" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" name="confirmPassword" placeholder="Confirm password" required>
                    </div>
                    <button type="submit" id="forgotPasswordBtn">Set New Password</button>
                </form>
                <div class="msg" id="forgotStep3Msg"></div>
            </div>

        </div>

        <div class="footer-link">
            Remembered? <a href="login.html">Back to sign in</a>
        </div>
    </div>

    <script src="recovery.js"></script>
</body>
</html>
