<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>USC FIT — Appeal attendance</title>
    <link rel="stylesheet" href="profile.css">
    <style>
        .appeal-page { max-width: 560px; margin: 0 auto; padding: 28px 20px 40px; }
        .appeal-page h1 { font-size: 24px; margin: 0 0 8px 0; }
        .appeal-page .sub { color: #666; font-size: 14px; margin: 0 0 20px 0; }
        .appeal-event-box {
            background: #fafafa; border: 1px solid #e7e2dd; border-radius: 8px;
            padding: 14px 16px; margin-bottom: 18px; font-size: 14px; line-height: 1.5;
        }
        .appeal-page label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 8px; color: #444; }
        .appeal-page textarea {
            width: 100%; min-height: 120px; padding: 12px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 14px; box-sizing: border-box; font-family: inherit;
        }
        .appeal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
        .appeal-actions button {
            padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; border: none;
        }
        .appeal-actions .btn-send { background: #992233; color: white; }
        .appeal-actions .btn-back { background: #eee; color: #333; }
        .appeal-msg { margin-top: 14px; font-size: 14px; display: none; }
        .appeal-msg.ok { color: #2f6b40; display: block; }
        .appeal-msg.err { color: #992233; display: block; }
    </style>
</head>
<body>
    <div class="appeal-page">
        <h1>Appeal attendance</h1>
        <p class="sub">Explain why the absence marking may be incorrect. Your message is sent to the event host only.</p>
        <div class="appeal-event-box" id="appealEventSummary">Loading event…</div>
        <form id="appealForm">
            <label for="appealMessage">Message to host</label>
            <textarea id="appealMessage" name="message" placeholder="e.g. I checked in with you at the court but was marked absent." required></textarea>
            <div class="appeal-actions">
                <button type="submit" class="btn-send" id="appealSubmitBtn">Send appeal</button>
                <button type="button" class="btn-back" id="appealBackBtn">Back to profile</button>
            </div>
            <div class="appeal-msg" id="appealFormMsg"></div>
        </form>
    </div>
    <script src="app-context.js"></script>
    <script src="appeal.js"></script>
</body>
</html>
